services:
  - type: web
    name: signaldesk-signalserver
    runtime: python
    plan: starter
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: DATABASE_PATH
        value: /var/data/push.sqlite3
      - key: POLL_SECONDS
        value: "65"
      - key: AUTO_DEMO
        value: "0"
    disk:
      name: signaldesk-push
      mountPath: /var/data
      sizeGB: 1
